[project]
name = "llvoice-server"
version = "0.1.0"
description = "Proxy LLVoiceTool: đăng nhập, tính credit, xoay vòng tài khoản MiniMax"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0",
    "httpx>=0.27",
    "llvoice-shared",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv.sources]
llvoice-shared = { path = "../shared", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
