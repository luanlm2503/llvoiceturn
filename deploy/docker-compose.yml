# Chạy từ thư mục deploy/: docker compose up -d
# Dev: chỉ cần db + redis, proxy chạy trực tiếp bằng uvicorn --reload trên máy.
# VPS: docker compose --profile prod up -d
name: llvoice

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: llvoice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-llvoice}
      POSTGRES_DB: llvoice
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llvoice"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"

  proxy:
    profiles: [prod]
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file: ../server/.env
    environment:
      LLV_DATABASE_URL: postgresql+asyncpg://llvoice:${POSTGRES_PASSWORD:-llvoice}@db:5432/llvoice
      LLV_REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  caddy:
    profiles: [prod]
    image: caddy:2-alpine
    restart: unless-stopped
    # Đọc LLV_DOMAIN từ deploy/.env lúc chạy, không nội suy lúc parse,
    # để lệnh dev "docker compose up -d db redis" không đòi biến này.
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - proxy

volumes:
  pgdata:
  caddy_data:
